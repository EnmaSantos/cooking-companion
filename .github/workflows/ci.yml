name: Cooking Companion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: USDA proxy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend -p 'test_*.py' -v

  ios:
    name: iOS simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on iPhone simulator
        run: >-
          xcodebuild test
          -project CookingCompanion.xcodeproj
          -scheme CookingCompanion
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Build Release simulator target
        run: >-
          xcodebuild build
          -project CookingCompanion.xcodeproj
          -scheme CookingCompanion
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
