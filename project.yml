name: CookingCompanion
options:
  bundleIdPrefix: com.enmasantos
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  CookingCompanion:
    type: application
    platform: iOS
    sources:
      - path: CookingCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enmasantos.CookingCompanion
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H2V3G89S96
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
  CookingCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CookingCompanionTests
    dependencies:
      - target: CookingCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.enmasantos.CookingCompanionTests
  CookingCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CookingCompanionUITests
    dependencies:
      - target: CookingCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.enmasantos.CookingCompanionUITests
